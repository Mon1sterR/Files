<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pa1nt.ru</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#dvd {
    position: absolute;
    padding: 12px 25px;
    border: 3px solid #00ff88;
    border-radius: 10px;
    color: #00ff88;
    font-family: Arial, sans-serif;
    font-size: 36px;
    font-weight: bold;
    user-select: none;
    white-space: nowrap;

    text-shadow: 0 0 10px currentColor;
    box-shadow: 0 0 20px currentColor;
}
</style>
</head>

<body>

<div id="dvd">Pa1nt.ru</div>

<script>
const dvd = document.getElementById("dvd");

let x = 100;
let y = 100;

let dx = 3.2;
let dy = 2.7;

function randomColor() {
    return `hsl(${Math.random() * 360}, 100%, 60%)`;
}

function changeColor() {
    const color = randomColor();

    dvd.style.color = color;
    dvd.style.borderColor = color;
    dvd.style.textShadow = `0 0 10px ${color}`;
    dvd.style.boxShadow = `0 0 20px ${color}`;
}

changeColor();

function animate() {
    x += dx;
    y += dy;

    const width = dvd.offsetWidth;
    const height = dvd.offsetHeight;

    if (x <= 0 || x + width >= window.innerWidth) {
        dx *= -1;
        changeColor();
    }

    if (y <= 0 || y + height >= window.innerHeight) {
        dy *= -1;
        changeColor();
    }

    dvd.style.left = x + "px";
    dvd.style.top = y + "px";

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
